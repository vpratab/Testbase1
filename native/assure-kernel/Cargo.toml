[package]
name = "assure-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 OR MIT"
description = "Deterministic native assurance kernels shared by the PZDR/RTVLAS Phase I prototypes."

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
hmac = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
